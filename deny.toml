[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Candle's GEMM stack uses paste only as a compile-time proc macro; it contributes no runtime code, and Compass will remove this exception when Candle migrates to pastey" },
  { id = "RUSTSEC-2021-0127", reason = "prolly-map 0.5.0 uses serde_cbor only to persist the versioned history map; this is an unmaintained advisory with no safe upgrade, and Compass will remove the exception when prolly-map migrates to a maintained CBOR implementation" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
# prolly-map 0.5.0 uses this exact xxhash implementation for content-addressed
# history nodes. BSL-1.0 is OSI-approved; keep the exception crate/version scoped
# instead of allowing the license for every future dependency.
exceptions = [
  { allow = ["BSL-1.0"], crate = "xxhash-rust@0.8.18" },
  # C-011 accepted the exact SurrealDB 3.2.4 artifact profiles under the
  # retained tagged BUSL-1.1 license and notice conditions. Keep every
  # exception dependency/version scoped; upgrades require a fresh review.
  { allow = ["BUSL-1.1"], crate = "surrealdb@3.2.4" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-collections@3.2.4" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-core@3.2.4" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-protocol@0.10.2" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-strand@3.2.4" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-types@3.2.4" },
  { allow = ["BUSL-1.1"], crate = "surrealdb-types-derive@3.2.4" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
