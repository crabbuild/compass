url = "https://github.com/fastapi/fastapi.git"
commit = "0c2b6aafd7a2e3a5bf1055ea0ed0a41da15ba5f4"
license_files = ["LICENSE"]
source_globs = ["fastapi/**/*.py", "tests/**/*.py"]
capabilities = ["http_routes", "dependency_injection", "security"]

[[repository]]
name = "fastapi-full-stack-template"
url = "https://github.com/fastapi/full-stack-fastapi-template.git"
commit = "68adb40d37425f6f8668ec7e5a054500d045e43e"
license_files = ["LICENSE"]
source_globs = ["backend/**/*.py"]
capabilities = ["http_routes", "dependency_injection", "data_modeling", "persistence"]

[[repository]]
name = "netbox"
url = "https://github.com/netbox-community/netbox.git"
commit = "194f3bbde20dd298d0cc2cad0e8d9134d548b431"
license_files = ["LICENSE.txt"]
source_globs = ["netbox/**/*.py"]
capabilities = ["http_routes", "dependency_injection", "security", "persistence"]

[[repository]]
name = "pydantic"
url = "https://github.com/pydantic/pydantic.git"
commit = "55084b74b3abfdfeee61105b9840e968a0739800"
