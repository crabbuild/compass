[[repository]]
name = "flask"
url = "https://github.com/pallets/flask.git"
commit = "d318b683471101618febed18996405ad26462110"
license_files = ["LICENSE.txt"]
source_globs = ["src/flask/**/*.py", "tests/**/*.py"]
capabilities = ["http_routes"]

[[repository]]
name = "celery"
url = "https://github.com/celery/celery.git"
commit = "8d2bccca0478cad48f31a75eaebc0ce389f65425"
license_files = ["LICENSE"]
