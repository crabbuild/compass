schema = "compass.python-framework-qualification/1"

[[repository]]
name = "django"
url = "https://github.com/django/django.git"
commit = "c9eb16a87e60c305fb3651459639f647cce498db"
license_files = ["LICENSE"]
source_globs = ["django/**/*.py", "tests/**/*.py"]
capabilities = ["http_routes", "persistence", "security"]

[[repository]]
