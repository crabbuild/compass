[[repository]]
name = "starlette"
url = "https://github.com/encode/starlette.git"
commit = "04d7869c1ec3016fa11f58382a9ac7bc14b46662"
license_files = ["LICENSE.md"]
source_globs = ["starlette/**/*.py", "tests/**/*.py"]
