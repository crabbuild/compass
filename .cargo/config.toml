[build]
# Keep final and intermediate artifacts local to this checkout/worktree. Four
# jobs limit CPU/RAM contention when the single phase verification build runs.
target-dir = "target"
jobs = 4

[cache]
# Cargo 1.88+ garbage-collects stale global registry/git cache entries. This
# does not delete checkout-local build artifacts.
auto-clean-frequency = "1 day"

[alias]
# Cargo's --tests also includes library/binary unit harnesses; --test '*' is
# the integration-only selector documented by Cargo.
phase-integration = ["test", "--workspace", "--test", "*", "--locked"]

[env]
# Every parser is compiled into Compass. Runtime grammar downloads and dynamic
# libraries are disabled in Cargo.toml, preserving the local-only code path.
TSLP_LANGUAGES = "apex,astro,bash,blade,c,cpp,csharp,dart,elixir,fortran,go,groovy,hcl,java,javascript,json,julia,kotlin,lua,objc,pascal,php,powershell,python,razor,ruby,rust,scala,sql,svelte,swift,tsx,typescript,verilog,vue,zig"
TSLP_LINK_MODE = "static"
# Keep the normal build default online for a fresh source checkout, but allow
# release/qualification jobs to force a pre-provisioned parser bundle with
# `TSLP_OFFLINE=1`. The runtime remains statically linked and never downloads
# grammars.
TSLP_OFFLINE = "0"
TSLP_ALLOW_FAILED_GRAMMARS = { value = "0", force = true }
