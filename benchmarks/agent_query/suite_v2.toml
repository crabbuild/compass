# Agent query evaluation suite v2: 50 fresh questions, five repositories, five
# languages. This file is the blackbox-fair companion to `suite.toml`: it keeps
# the same pinned checkouts and source-reviewed judgments, and it adds the
# questions and the query surfaces the first suite did not measure.
#
# Fairness contract, per row:
#   * Both tools are blackboxes over the same pinned checkout. The oracle is
#     read from source only; neither tool's output is used as ground truth.
#   * Each row asks the same question of the same source declaration. The argv
#     uses the address form that each tool documents for that surface
#     (Compass: plain or qualified symbol name, file path; Graphify: node label
#     or file label). No row grants one tool an affordance the other lacks.
#   * Both tools run their closest documented operation for the question:
#     explain -> explain/explain, usage -> callers/affected, outbound calls ->
#     callees/explain, transitive dependents -> impact/affected, connectivity ->
#     path/path, discovery -> query/query, and name resolution - the
#     `ambiguity` and `negative` rows - -> search/explain, because
#     `graphify explain` is the command that reports the candidate list for a
#     name that matches several nodes and the explicit no-match for a name that
#     matches none.
#   * `path` questions pass `--undirected` to Graphify because Compass `path`
#     searches relationships in both directions; Graphify documents
#     `--undirected` as the equivalent.
#   * A `pick_list` row requires a real candidate list (at least two distinct
#     candidates) plus at least one of the reviewed candidates for the name.
#     It deliberately does not require a specific pair: a bounded page shows
#     only part of the candidate set, so demanding named candidates would score
#     which entries happen to fit rather than whether the tool offers a list.
#   * `broad` rows use a 600-token page budget for both tools, the reviewed
#     floor at which either tool can render a bounded page for these questions
#     instead of spending the whole page on its own metadata envelope.
#   * Default output form on both sides, at the same approximate token budget
#     where the command is budgeted. Continuations are each tool's documented
#     one (Compass `--cursor`, Graphify `--budget`), and the runner prices the
#     whole workflow.
#   * Oracles are the file names, declaration lines, call-site lines, and symbol
#     names the reviewer read in the pinned checkout. They are a deterministic
#     text-recall proxy, not an independent precision oracle.
#   * Where a tool's graph or command cannot produce a source-verified fact, the
#     row fails and REPORT.md counts it as a recall gap. No oracle is weakened to
#     favour either tool.
#
# Kinds:
#   explain        - locate a declaration with its file and line
#   explain_source - return the declaration source text itself
#   callers        - incoming usage, must return the callers
#   callees        - outbound calls, must return the callees
#   impact         - transitive dependents of a symbol
#   path           - symbol-to-symbol connectivity
#   file_path      - file-to-file connectivity
#   ambiguity      - short name with several candidates, must offer a pick list
#   negative       - absent symbol, must answer no-match instead of guessing
#   broad          - natural question whose answer needs bounded follow-up

schema = "compass.agent-query-suite/1"

