# Source-first diagnostic sample, registered before querying either tool on fd.
# This is one additional Rust repository, not a representative held-out corpus.
# Text matching remains a recall proxy; edge_witnesses_fd.json separately
# records relationship identity and every reviewed occurrence for selected calls.
# Default query forms are used on both tools. Undirected path semantics match.
# Source excerpts are reported separately as a feature capability.
schema = "compass.agent-query-suite/1"

[[repository]]
name = "fd"
language = "Rust"
url = "https://github.com/sharkdp/fd.git"
commit = "b422e5d8c9cffaa1ae43ba68e7b97a60fb3e8ae5"

[[repository.anchor]]
file = "src/exec/command.rs"
line = 60
symbol = "execute_commands"
judgment = "The generic free function is declared at line 60."

[[repository.anchor]]
file = "src/exec/mod.rs"
line = 51
symbol = "new_batch"
judgment = "CommandSet::new_batch begins at line 51."

[[repository.anchor]]
file = "src/exec/command.rs"
line = 101
symbol = "handle_cmd_error"
judgment = "The free error handler is declared at line 101."

[[repository.anchor]]
file = "src/filter/size.rs"
line = 28
symbol = "from_string"
judgment = "SizeFilter::from_string starts at line 28; OwnerFilter has another method with this name."

[[repository.anchor]]
file = "src/exec/mod.rs"
