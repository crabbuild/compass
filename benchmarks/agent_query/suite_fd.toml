judgment = "mod.rs:14 imports ExitCode and merge_exitcodes; the latter is called at 116 and declared in exit_codes.rs:46."

[[repository.question]]
id = "fd-broad-command-errors"
kind = "broad"
subject = "how are command errors handled"
compass = ["query", "how are command errors handled"]
graphify = ["query", "how are command errors handled"]
