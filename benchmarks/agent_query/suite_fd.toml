judgment = "CommandBuilder::finish begins at line 191."

[[repository.question]]
id = "fd-explain-execute-commands"
kind = "explain"
subject = "execute_commands declaration"
compass = ["explain", "execute_commands"]
graphify = ["explain", "execute_commands()"]
expect = "answer"
required = ["src/exec/command.rs", "60"]
judgment = "src/exec/command.rs:60 declares execute_commands."

