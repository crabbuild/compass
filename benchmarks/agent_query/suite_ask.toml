# Natural-language routing development comparison across five real languages.
# Reuses source-reviewed caller/callee facts from suite_v2.toml; these are not
# independent held-out judgments. The exact same question and 2000-token budget
# are sent to Compass ask and Graphify query. One response, no follow-ups.
# Score selected-fact text recall first; this does not certify every returned edge.

