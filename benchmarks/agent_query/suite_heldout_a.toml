# Held-out confirmation panel A. Product binaries are frozen before this panel.
# Questions and source witnesses are committed before either tool builds or queries these repositories.
# Purposively chosen small libraries, one per existing language; not a random or representative sample.
# Primary verdicts are text recall proxies. Separate edge/path audits retain exact identities and source sites.
# Callers/affected and callees/explain are corresponding public operations, not identical relation-filter interfaces.
# Paths are undirected for both tools. All failures, ambiguities, and bound outcomes remain in the denominator.
# Broad query pages start at 600 estimated tokens, with up to three documented follow-ups; ask rows request 2000.
schema = "compass.agent-query-suite/1"

