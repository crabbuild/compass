schema = "compass.performance-suite/1"

[[repository]]
name = "django"
url = "https://github.com/django/django.git"
mutation_suffix = ".py"
[[repository.query]]
question = "where is URL resolution implemented"
required = ["URLResolver"]
[[repository.query]]
question = "how does a model save data"
required = ["Model", "save"]

[[repository]]
name = "spring"
url = "https://github.com/spring-projects/spring-framework.git"
mutation_suffix = ".java"
[[repository.query]]
question = "how is the application context refreshed"
required = ["ApplicationContext"]
[[repository.query]]
question = "how are HTTP requests dispatched"
required = ["DispatcherServlet"]

[[repository]]
name = "rails"
url = "https://github.com/rails/rails.git"
mutation_suffix = ".rb"
[[repository.query]]
question = "how does Active Record save a model"
required = ["ActiveRecord"]
[[repository.query]]
question = "how are routes recognized"
required = ["RouteSet"]

[[repository]]
name = "laravel"
url = "https://github.com/laravel/framework.git"
mutation_suffix = ".php"
